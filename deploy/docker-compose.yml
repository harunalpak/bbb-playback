services:
  bbb-playback:
    image: ghcr.io/harunalpak/bbb-playback:custom
    container_name: bbb-playback
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./playback-site.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: bbb-playback-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 120
