# Host (sunucu) nginx vhost örneği — /etc/nginx/sites-available/bbb.kursadresi.com
# Etkinleştirme:
#   ln -s /etc/nginx/sites-available/bbb.kursadresi.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bbb.kursadresi.com   (SSL bloklarını certbot ekler)
server {
  listen 80;
  listen [::]:80;
  server_name bbb.kursadresi.com;

  # Kayıt izleme linkleri: https://bbb.kursadresi.com/playback/presentation/2.3/<recordId>
  location /playback/presentation/2.3/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kök adrese gelenleri player yoluna yönlendir
  location = / {
    return 302 /playback/presentation/2.3/;
  }
}
