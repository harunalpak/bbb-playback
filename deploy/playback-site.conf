# Container içi nginx ayarı: SPA fallback.
# Host nginx /playback/presentation/2.3/ prefix'ini temizleyip buraya yollar;
# dosya yoksa index.html döner, rota çözümü React tarafında yapılır.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
